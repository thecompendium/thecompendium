<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Compendium | IARE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    window.process = window.process || { env: { API_KEY: "" } };
  </script>
  <style>
    :root {
      /* Dark Theme (Default) */
      --primary-bg: #010b1a;
      --secondary-bg: #021496;
      --card-bg: #0d121f;
      --card-hover-bg: #161e2e;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-color: #facc15;
      --border-color: rgba(250, 204, 21, 0.2);
      --nav-bg: rgba(2, 20, 150, 0.85);
      --input-bg: rgba(0, 0, 0, 0.3);
      --footer-bg: #000000;
    }

    .light-theme {
      /* Light Theme - Clean, Professional, High Contrast */
      --primary-bg: #ffffff;
      --secondary-bg: #f1f5f9;
      --card-bg: #ffffff;
      --card-hover-bg: #f8fafc;
      --text-main: #010b1a; /* Deeper Navy for maximum readability */
      --text-muted: #334155; /* Slate 700 for clear secondary text */
      --accent-color: #021496; /* Use Brand Blue as accent in light mode */
      --border-color: rgba(2, 20, 150, 0.15);
      --nav-bg: rgba(255, 255, 255, 0.95);
      --input-bg: #f8fafc;
      --footer-bg: #010b1a; /* Keep footer dark for depth */
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--primary-bg);
      color: var(--text-main);
      transition: background-color 0.4s ease, color 0.4s ease;
      font-size: 16px;
      line-height: 1.6;
      margin: 0;
    }

    h1, h2, h3, h4, h5, h6, .serif-font {
      font-family: 'Crimson Pro', serif;
      line-height: 1.2;
    }

    .text-h1 { font-size: 48px; font-weight: 700; }
    .text-h2 { font-size: 36px; font-weight: 700; }
    .text-h3 { font-size: 28px; font-weight: 600; }
    .text-h4 { font-size: 24px; font-weight: 600; }
    
    .glow-card {
      background-color: var(--card-bg) !important;
      border: 1px solid var(--border-color) !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .glow-card:hover {
      border-color: var(--accent-color) !important;
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(2, 20, 150, 0.15);
    }

    .light-theme .glow-card:hover {
      box-shadow: 0 20px 40px rgba(2, 20, 150, 0.1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fadeInUp {
      opacity: 0;
      animation: fadeInUp 1s ease-out forwards;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

}
</script>
